<html lang="en">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=Lora:ital,wght@1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #0e1012;
    --panel: #171a1d;
    --panel-2: #1d2124;
    --ink: #d9dbda;
    --muted: #868d92;
    --hair: #262b2f;
    --accent: #a4adb3;
    --accent-soft: rgba(164, 173, 179, 0.10);
    --bull: #7fb3a2;
    --bull-soft: rgba(127, 179, 162, 0.12);
    --bear: #c4918a;
    --bear-soft: rgba(196, 145, 138, 0.12);
    --gold: #b7ac90;
    --gold-soft: rgba(183, 172, 144, 0.12);
    --font-display: "Manrope", "Segoe UI", sans-serif;
    --font-body: "Source Sans 3", "Segoe UI", sans-serif;
    --font-quote: "Lora", Georgia, serif;
    --font-mono: "IBM Plex Mono", Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
  a { color: inherit; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 18px 80px; }

  /* top bar */
  .board { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--hair); }
  .board-in { max-width: 820px; margin: 0 auto; padding: 10px 18px; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 18px; align-items: center; }
  .team { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: 0.02em; line-height: 1.1; }
  .team small { display: block; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; color: var(--muted); margin-top: 2px; }
  .score { text-align: center; }
  .score .px { font-family: var(--font-mono); font-weight: 500; font-size: 26px; letter-spacing: 0.01em; line-height: 1; font-variant-numeric: tabular-nums; }
  .score .sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .clock { text-align: right; font-size: 12.5px; color: var(--muted); }
  .clock b { display: block; color: var(--ink); font-family: var(--font-display); font-size: 14px; font-weight: 600; }
  .board button { margin-top: 5px; }
  button { font-family: var(--font-display); font-weight: 600; font-size: 12.5px; letter-spacing: 0.04em; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--hair); background: var(--panel-2); color: var(--ink); cursor: pointer; }
  button.quiet { background: transparent; color: var(--accent); }
  button:focus-visible, textarea:focus, summary:focus-visible { outline: 2px solid var(--bull); outline-offset: 2px; }
  @media (max-width: 560px) { .board-in { grid-template-columns: 1fr auto; padding: 8px 14px; gap: 2px 10px; } .score { grid-column: 1; text-align: left; } .score .px { font-size: 22px; } .clock { grid-row: 1 / span 2; grid-column: 2; align-self: center; } .team { font-size: 15px; } .board button { padding: 5px 10px; } }

  /* sections */
  section { margin-top: 40px; }
  .sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--hair); }
  .sec-h h2 { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: 0.01em; margin: 0; white-space: nowrap; }
  .sec-h .num { display: none; }
  .sec-h .tip { font-size: 13px; color: var(--muted); }

  /* regime chips */
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .chip { background: var(--panel); border-radius: 10px; padding: 10px 12px; }
  .chip .k { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .chip .v { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.2; margin-top: 3px; }
  .chip.bull .v { color: var(--bull); } .chip.bear .v { color: var(--bear); } .chip.amber .v { color: var(--gold); }
  .read { margin-top: 14px; max-width: 66ch; font-size: 17px; }
  .read p { margin: 0 0 10px; }

  /* levels */
  .field { background: var(--panel); border-radius: 12px; overflow: hidden; }
  .endzone { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; text-align: left; padding: 10px 14px; color: var(--muted); }
  .endzone.bear { border-bottom: 1px solid var(--hair); }
  .endzone.bull { border-top: 1px solid var(--hair); }
  .yard { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--hair); font-family: var(--font-mono); font-size: 13px; }
  .yard .px { font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .yard .what { font-family: var(--font-body); font-size: 14.5px; line-height: 1.35; color: var(--ink); }
  .yard .role { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .yard.a { background: var(--gold-soft); }
  .yard.a .px { color: var(--gold); }
  .yard .stars { color: var(--gold); letter-spacing: 0.05em; font-size: 11.5px; }
  .ball { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: center; padding: 11px 14px; background: var(--accent-soft); border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent); font-family: var(--font-display); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .ball .px { color: var(--ink); font-family: var(--font-mono); font-size: 19px; font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .ball .ico { display: none; }
  details.more { background: var(--panel-2); }
  details.more summary { cursor: pointer; list-style: none; padding: 9px 14px; font-family: var(--font-display); font-size: 12px; letter-spacing: 0.06em; color: var(--accent); }
  details.more summary::-webkit-details-marker { display: none; }
  details.more summary::before { content: "+ "; }
  details.more[open] summary::before { content: "− "; }
  @media (max-width: 520px) { .yard { grid-template-columns: 124px 1fr; padding: 8px 12px; } .yard .role { display: none; } .yard .what { font-size: 13px; } .yard .px { font-size: 12px; white-space: normal; } .ball { grid-template-columns: 124px 1fr; } }

  /* scenarios */
  .plays { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .play { background: var(--panel); border-radius: 12px; padding: 16px; }
  .play .tag { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .play.bull .tag { color: var(--bull); } .play.bear .tag { color: var(--bear); } .play.chop .tag { color: var(--gold); }
  .play .big { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.15; margin: 4px 0 10px; font-variant-numeric: tabular-nums; }
  .play .step { display: grid; grid-template-columns: 70px 1fr; gap: 8px; padding: 7px 0; border-top: 1px solid var(--hair); font-size: 14.5px; }
  .play .step b { font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
  .play .fits { margin-top: 10px; font-size: 13px; color: var(--muted); }

  /* mindset */
  .huddle { background: var(--panel); border-radius: 12px; padding: 26px 24px; text-align: center; }
  .huddle .q { font-family: var(--font-quote); font-weight: 400; font-style: italic; font-size: 22px; line-height: 1.45; text-wrap: balance; max-width: 34ch; margin: 0 auto; }
  .huddle .who { margin-top: 10px; font-family: var(--font-display); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  /* calendar + news */
  .news { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .news { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border-radius: 12px; padding: 14px 16px; }
  .card h3 { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 8px; color: var(--muted); }
  .ev { display: grid; grid-template-columns: 96px 1fr; gap: 8px; padding: 7px 0; border-top: 1px solid var(--hair); font-size: 14px; }
  .ev .t { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ev .t b { display: block; color: var(--ink); font-weight: 500; }
  .ev .i { font-family: var(--font-display); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; margin-right: 6px; vertical-align: middle; }
  .ev .i.high { background: var(--bear-soft); color: var(--bear); } .ev .i.medium { background: var(--gold-soft); color: var(--gold); }
  .ev .fp { color: var(--muted); font-size: 12.5px; }
  .hl { padding: 7px 0; border-top: 1px solid var(--hair); font-size: 14px; }
  .hl a { text-decoration: none; } .hl a:hover { text-decoration: underline; }
  .hl .t { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; }

  /* watch */
  ul.watch { margin: 0; padding-left: 20px; } ul.watch li { margin: 6px 0; }
  .one { margin-top: 14px; padding: 14px 16px; background: var(--panel); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; font-family: var(--font-display); font-size: 16px; font-weight: 600; line-height: 1.4; }

  /* paste */
  details.paste { margin-top: 44px; border-top: 1px solid var(--hair); padding-top: 12px; }
  details.paste summary { cursor: pointer; font-family: var(--font-display); font-size: 12px; letter-spacing: 0.06em; color: var(--muted); }
  textarea { width: 100%; min-height: 140px; margin-top: 10px; padding: 12px; border: 1px solid var(--hair); border-radius: 10px; background: var(--panel); color: var(--ink); font-family: var(--font-mono); font-size: 12.5px; line-height: 1.4; resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .status { color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: no-preference) { button { transition: filter 0.15s; } button:hover { filter: brightness(1.06); } }
</style>
</head>
<body>
<div class="board">
  <div class="board-in">
    <div class="team" id="team">MNQ<small>Session Gameplan</small></div>
    <div class="score"><div class="px" id="bPx">—</div><div class="sub" id="bSub">waiting for the feed</div></div>
    <div class="clock"><span id="bAge">sheet age</span><b id="bRegime">—</b><button id="fetch" class="quiet">Refresh</button></div>
  </div>
</div>

<div class="wrap">
  <div id="out"></div>

  <details class="paste">
    <summary>Paste sheets by hand</summary>
    <textarea id="in" spellcheck="false" aria-label="Level sheets"></textarea>
    <div class="row">
      <button id="build">Build gameplan</button>
      <button id="copy" class="quiet">Copy plan as text</button>
      <button id="sample" class="quiet">Load example</button>
      <span class="status" id="status"></span>
    </div>
  </details>
</div>

<script>
(function () {
  const FEED_URL = "https://ahgrjejodqjyvlxktubs.supabase.co/rest/v1/sheets?select=kind,text,received_at&kind=in.(SD,VP)&order=received_at.desc&limit=12";
  const FEED_KEY = "sb_publishable_z_PuIMBIvezfM-QuMqXFzQ_2P4tgHTf";
  const NEWS_URL = "https://ahgrjejodqjyvlxktubs.supabase.co/functions/v1/news";
  const NEAR = 6;
  const SAMPLE = `#SD MNQ1! 2026-09-11 21:40 ET px 29085.25
KEY|PWH|29310.00
SD|1H Supply|29205.00|far 29215.50
HEAT|PDH|29215.25|buy-side
SW|1H swing|29180.50
TRAP|Trapped buyers|29198.00|potential box 29191.50
PIV|15m pivot|29120.00
KEY|16:00 close|29088.50
SD|15m Demand|29059.75|far 29051.00
TRAP|Trapped sellers|29056.50|confirmed box 29060.25
KEY|Asia close|29061.25
PIV|15m pivot|29002.25
KEY|PDL|28990.75
HEAT|swing pool|28985.00|sell-side
SD|1H Demand|28940.25|far 28928.00
ATR|Asia|62.25 / 95.50  65%
DAY|180.00 / 310.50  58%
DELTA|Asia|+1,240
MKT|Balanced
#VP MNQ1! 2026-09-11 21:40 ET px 29085.25
PS|prev session New York VAH|29142.50
PS|prev session New York POC|29101.75
PS|prev session New York VAL|29048.00
PD|prior day VAH|29160.25
PD|prior day POC|29102.00
PD|prior day VAL|29020.50
PW|prior week VAH|29290.00
PW|prior week POC|29150.75
PW|prior week VAL|28960.25
DEV|developing Asia VAH|29110.00
DEV|developing Asia POC|29078.25
DEV|developing Asia VAL|29052.50
NPOC|naked POC D|29338.00|D
REG|Balanced - opened inside value|Asia|open inside|now inside|140 min`;

  // Short sayings from professional traders on the mind game. One per day.
  const QUOTES = [
    ["The goal of a successful trader is to make the best trades. Money is secondary.", "Alexander Elder"],
    ["Losers average losers.", "Paul Tudor Jones"],
    ["Don't focus on making money; focus on protecting what you have.", "Paul Tudor Jones"],
    ["The elements of good trading are: cutting losses, cutting losses, and cutting losses.", "Ed Seykota"],
    ["Everybody gets what they want out of the market.", "Ed Seykota"],
    ["There is a time to go long, a time to go short, and a time to go fishing.", "Jesse Livermore"],
    ["Amateurs think about how much money they can make. Professionals think about how much they could lose.", "Jack Schwager"],
    ["Trade what you see, not what you think.", "Linda Raschke"],
    ["The best trades are the ones you don't take.", "Trading floor saying"],
    ["Confidence comes from preparation, not from the last trade.", "Brett Steenbarger"],
    ["You have to take your losses so you can take your profits.", "Marty Schwartz"],
    ["Risk comes from not knowing what you are doing.", "Warren Buffett"],
    ["The market is never wrong; opinions often are.", "Jesse Livermore"],
    ["Plan the trade, trade the plan.", "Trading floor saying"]
  ];

  const $ = (id) => document.getElementById(id);
  const fmt = (x) => x.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = (s) => { const v = parseFloat(String(s).replace(/,/g, "")); return isNaN(v) ? null : v; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  // ---- parse ----------------------------------------------------------------
  function parse(text) {
    const d = { levels: [], px: null, ticker: "", stamp: "", atr: null, day: null, delta: null, mkt: null, reg: null, hasSD: false, hasVP: false, unknown: [] };
    text.split(/\r?\n/).forEach((raw) => {
      const line = raw.trim();
      if (!line) return;
      const m = line.match(/^#(SD|VP)\s+(\S+)\s+(\S+\s+\S+)\s+ET\s+px\s+([\d.,]+)/);
      if (m) { d[m[1] === "SD" ? "hasSD" : "hasVP"] = true; d.ticker = m[2]; d.stamp = m[3]; d.px = num(m[4]); return; }
      const p = line.split("|").map((s) => s.trim());
      const fam = p[0];
      if (fam === "ATR") { d.atr = parseRange(p.slice(1).join(" ")); return; }
      if (fam === "DAY") { d.day = parseRange(p.slice(1).join(" ")); return; }
      if (fam === "DELTA") { d.delta = { sess: p[1] || "", v: num(p[2] || "") }; return; }
      if (fam === "MKT") { d.mkt = p[1] || null; return; }
      if (fam === "REG") { d.reg = { name: p[1] || "", sess: p[2] || "", open: p[3] || "", now: p[4] || "", mins: p[5] || "" }; return; }
      const px = num(p[2]);
      if (["KEY", "SD", "SW", "PIV", "TRAP", "HEAT", "EQ", "PS", "PD", "PW", "PM", "DEV", "NPOC"].includes(fam) && px !== null) d.levels.push({ fam, name: p[1], px, extra: p[3] || "" });
      else d.unknown.push(line);
    });
    return d;
  }
  function parseRange(s) {
    const m = s.match(/([\d.,]+)\s*\/\s*([\d.,]+)\s+(\d+)%/);
    const sess = s.split(" ")[0];
    if (m) return { sess, used: num(m[1]), avg: num(m[2]), pct: parseInt(m[3], 10) };
    const u = s.match(/([\d.,]+)/);
    return { sess, used: u ? num(u[1]) : null, avg: null, pct: null };
  }

  // ---- zones --------------------------------------------------------------------
  const fwKey = (l) => (l.fam === "SW" || l.fam === "PIV") ? "PIV" : (l.fam === "PS" || l.fam === "DEV") ? "PS" : l.fam;
  const SHORT = { PS: "value", DEV: "dev value", PD: "day value", PW: "week value", PM: "month value", NPOC: "naked POC", SD: "S&D", SW: "swing", PIV: "pivot", KEY: "key", TRAP: "trap", HEAT: "heat", EQ: "EQ" };
  function buildZones(levels, px) {
    const band = px * 0.0005;
    const sorted = levels.slice().sort((a, b) => b.px - a.px);
    const zones = [];
    sorted.forEach((l) => {
      const z = zones[zones.length - 1];
      if (z && z.lo - l.px <= band && z.hi - l.px <= band * 1.6) { z.items.push(l); z.lo = l.px; }
      else zones.push({ hi: l.px, lo: l.px, items: [l] });
    });
    zones.forEach((z) => {
      z.fws = [...new Set(z.items.map(fwKey))];
      z.score = z.fws.length;
      z.mid = (z.hi + z.lo) / 2;
      z.role = roleOf(z, px);
      // dedupe names for the label
      const seen = new Set();
      z.names = z.items.map((i) => i.name).filter((n) => { if (seen.has(n)) return false; seen.add(n); return true; });
    });
    return zones;
  }
  function roleOf(z, px) {
    const names = z.items.map((i) => i.name + " " + i.extra).join(" ").toLowerCase();
    const above = z.mid > px;
    if (/poc/.test(names)) return "magnet";
    if (/trapped buyers/.test(names)) return above ? "trapped supply" : "reclaim trigger";
    if (/trapped sellers/.test(names)) return above ? "reclaim trigger" : "trapped demand";
    if (/supply/.test(names)) return "supply";
    if (/demand/.test(names)) return "demand";
    if (/vah|val/.test(names)) return "value edge";
    if (/heat|pool|pdh|pdl|pwh|pwl|eqh|eql/.test(names)) return above ? "stops above" : "stops below";
    return above ? "resistance" : "support";
  }
  const stars = (n) => "★".repeat(Math.min(n, 5));
  const zl = (z) => z.hi === z.lo ? fmt(z.hi) : fmt(z.lo) + "–" + fmt(z.hi);
  const zw = (z) => z.names.join(" + ");
  const zs = (z) => zl(z) + " (" + zw(z) + ")";

  // ---- regime -------------------------------------------------------------------
  function vaState(px, levels, fam) {
    const vah = levels.find((l) => l.fam === fam && /VAH/.test(l.name));
    const val = levels.find((l) => l.fam === fam && /VAL/.test(l.name));
    if (!vah || !val) return null;
    return { st: px > vah.px ? 1 : px < val.px ? -1 : 0, vah: vah.px, val: val.px, poc: (levels.find((l) => l.fam === fam && /POC/.test(l.name)) || {}).px };
  }
  const word = (st) => st > 0 ? "above" : st < 0 ? "below" : "inside";
  function regime(d) {
    const px = d.px;
    const ps = vaState(px, d.levels, "PS"), pd = vaState(px, d.levels, "PD"), pw = vaState(px, d.levels, "PW"), pm = vaState(px, d.levels, "PM");
    const mkt = (d.mkt || "").toLowerCase();
    const trending = /trending/.test(mkt);
    const up = /up/.test(mkt);
    const stretched = d.atr && d.atr.pct !== null && d.atr.pct >= 100;
    const deltaSign = d.delta && d.delta.v !== null ? Math.sign(d.delta.v) : 0;
    let name = "Waiting for value", lean = 0, note = "";
    const base = ps || pd;
    if (base) {
      if (base.st === 0) {
        if (trending) { name = "Push inside value"; lean = up ? 1 : -1; note = "Trending inside the prior value. It needs to get through " + (up ? "VAH " + fmt(base.vah) : "VAL " + fmt(base.val)) + " and hold, or it rotates back."; }
        else { name = "Balanced rotation"; lean = 0; note = "Inside the prior value with no trend. Edges get faded toward the POC" + (base.poc ? " " + fmt(base.poc) : "") + "."; }
      } else {
        const side = base.st > 0 ? "above" : "below";
        const agrees = trending && ((base.st > 0 && up) || (base.st < 0 && !up));
        if (agrees && deltaSign === base.st) { name = "Acceptance " + side + " value"; lean = base.st; note = "Price left value, the Market line agrees and the delta is on the same side. Pullbacks to " + (base.st > 0 ? "VAH " + fmt(base.vah) : "VAL " + fmt(base.val)) + " are the continuation spots."; }
        else if (trending && !agrees) { name = "Rotation back toward value"; lean = -base.st; note = "Price is " + side + " value but the session is trending the other way. Watch a re-entry through " + (base.st > 0 ? "VAH " + fmt(base.vah) : "VAL " + fmt(base.val)) + "."; }
        else { name = "Testing " + side + " value"; lean = 0; note = "Outside value without a trend. Hold = expansion, failure back inside = fade to the POC" + (base.poc ? " " + fmt(base.poc) : "") + "."; }
      }
    }
    if (stretched) note += " The session has used " + d.atr.pct + "% of its average range, so the room is gone: extremes are for fading, not chasing.";
    return { name, lean, note, ps, pd, pw, pm, trending, up, stretched, deltaSign };
  }

  // ---- plays: from where the ball is, then beyond -------------------------------
  function plays(d, R, zones) {
    const px = d.px;
    const above = zones.filter((z) => z.lo > px).slice().reverse();   // nearest first
    const below = zones.filter((z) => z.hi < px);                      // nearest first
    const firstA = (arr) => arr.findIndex((z) => z.score >= 3);
    const listOf = (arr) => arr.map(zs).join(", then ");
    // Offense: hold the nearest support, drive through the resistances, then past the first A zone.
    const oHold = below[0], oA = firstA(above);
    const oDrive = oA >= 0 ? above.slice(0, oA + 1) : above.slice(0, 2);
    const oBeyond = oA >= 0 ? above.slice(oA + 1, oA + 4) : above.slice(2, 5);
    // Defense: fail under the nearest resistance, drive down through the supports, then past the first A zone.
    const dHold = above[0], dA = firstA(below);
    const dDrive = dA >= 0 ? below.slice(0, dA + 1) : below.slice(0, 2);
    const dBeyond = dA >= 0 ? below.slice(dA + 1, dA + 4) : below.slice(2, 5);
    const fits = (dir) => R.lean === dir ? "Rides the regime." : R.lean === -dir ? "Counter-regime: needs extra confirmation." : "Neutral regime: take it only at an A zone.";
    return {
      bull: { hold: oHold, drive: oDrive, beyond: oBeyond, fits: fits(1),
        trigger: oHold ? "Price at " + fmt(px) + ". The trigger is a 5m close that holds above " + zs(oHold) + ". A trapped sellers box confirming there is the cleanest version." : "Price at " + fmt(px) + " with no support under it on the sheet.",
        inval: oHold ? "A 5m close below " + fmt(oHold.lo) + ", or a sweep under it that does not come back." : "A 5m close through the nearest level.",
        driveTxt: oDrive.length ? listOf(oDrive) : "the first resistance", beyondTxt: oBeyond.length ? listOf(oBeyond) : "open field, no drawn levels" },
      bear: { hold: dHold, drive: dDrive, beyond: dBeyond, fits: fits(-1),
        trigger: dHold ? "Price at " + fmt(px) + ". The trigger is a 5m close that fails under " + zs(dHold) + ". A trapped buyers box confirming there is the cleanest version." : "Price at " + fmt(px) + " with no resistance over it on the sheet.",
        inval: dHold ? "A 5m close above " + fmt(dHold.hi) + ", or a sweep over it that does not come back." : "A 5m close through the nearest level.",
        driveTxt: dDrive.length ? listOf(dDrive) : "the first support", beyondTxt: dBeyond.length ? listOf(dBeyond) : "open field, no drawn levels" },
      chop: { top: above[0], bot: below[0], fits: R.lean === 0 ? "The base case in a balanced regime." : "Stand aside if the bracket holds past the first hour.",
        txt: "Neither side gets a 5m close through its zone. Fade " + (above[0] ? fmt(above[0].lo) : "resistance") + " and " + (below[0] ? fmt(below[0].hi) : "support") + " toward " + (R.ps && R.ps.poc ? "the POC " + fmt(R.ps.poc) : "the middle") + ". Small targets, no chasing." }
    };
  }

  // ---- news -------------------------------------------------------------------------
  let newsData = null;
  const etFmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" });
  const etDay = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", month: "short", day: "numeric" });
  function newsHtml() {
    if (!newsData) return '<div class="news"><div class="card"><h3>USD calendar · ET</h3><p class="empty">Loading the week\'s calendar...</p></div><div class="card"><h3>Headlines</h3><p class="empty">Loading headlines...</p></div></div>';
    const now = Date.now();
    const cal = (newsData.calendar || []).map((e) => ({ ...e, ts: new Date(e.date).getTime() })).filter((e) => !isNaN(e.ts)).sort((a, b) => a.ts - b.ts);
    const upcoming = cal.filter((e) => e.ts >= now - 3600000).slice(0, 8);
    const list = upcoming.length ? upcoming : cal.slice(-5);
    const calRows = list.map((e) => {
      const mins = Math.round((e.ts - now) / 60000);
      const when = mins > 0 ? (mins < 60 ? "in " + mins + " min" : mins < 2880 ? "in " + Math.round(mins / 60) + " h" : "in " + Math.round(mins / 1440) + " d") : "done";
      const fp = (e.forecast ? "f " + e.forecast : "") + (e.previous ? (e.forecast ? " · " : "") + "p " + e.previous : "");
      return `<div class="ev"><div class="t"><b>${etFmt.format(new Date(e.ts))}</b>${etDay.format(new Date(e.ts))} · ${when}</div><div><span class="i ${e.impact.toLowerCase()}">${e.impact}</span>${esc(e.title)}${fp ? ` <span class="fp">${esc(fp)}</span>` : ""}</div></div>`;
    }).join("");
    const calNote = upcoming.length ? "" : '<p class="empty">Nothing left on this week\'s USD calendar. Next week\'s list is published Sunday.</p>';
    const hl = (newsData.headlines || []).slice(0, 8).map((h) => `<div class="hl"><a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.title)}</a><div class="t">${esc(h.at || "")}</div></div>`).join("");
    return `<div class="news"><div class="card"><h3>USD calendar · ET</h3>${calRows || ""}${calNote}</div><div class="card"><h3>Headlines · ${esc(newsData.source || "")}</h3>${hl || '<p class="empty">No headlines right now.</p>'}</div></div>`;
  }
  async function fetchNews() {
    try { const r = await fetch(NEWS_URL, { cache: "no-store" }); if (r.ok) { newsData = await r.json(); const el = $("newsBox"); if (el) el.innerHTML = newsHtml(); } }
    catch (e) { const el = $("newsBox"); if (el) el.innerHTML = '<div class="card"><h3>Calendar</h3><p class="empty">News feed not reachable right now.</p></div>'; }
  }

  // ---- render -------------------------------------------------------------------------
  let plainText = "";
  let lastD = null;
  const yard = (z) => `<div class="yard${z.score >= 3 ? " a" : ""}"><div class="px">${zl(z)}<div class="stars">${stars(z.score)}</div></div><div class="what">${esc(zw(z))}</div><div class="role">${z.role}</div></div>`;
  function render(d) {
    lastD = d;
    const out = $("out");
    if (d.px === null || d.levels.length === 0) {
      out.innerHTML = '<section><div class="sec-h"><h2>No sheet yet</h2></div><p class="empty">The page fills itself from the TradingView feed. Nothing has arrived yet, or paste the two sheets by hand below.</p></section>';
      return;
    }
    const R = regime(d);
    const zones = buildZones(d.levels, d.px);
    const above = zones.filter((z) => z.lo > d.px);                 // far -> near
    const below = zones.filter((z) => z.hi < d.px);                 // near -> far
    const at = zones.filter((z) => z.lo <= d.px && z.hi >= d.px);
    const nearAbove = above.slice(-NEAR), farAbove = above.slice(0, Math.max(0, above.length - NEAR));
    const nearBelow = below.slice(0, NEAR), farBelow = below.slice(NEAR);
    const aAbove = above.filter((z) => z.score >= 3).slice(-1)[0];
    const aBelow = below.filter((z) => z.score >= 3)[0];
    const P = plays(d, R, zones);
    const sessName = (d.atr && d.atr.sess) || (d.reg && d.reg.sess) || "Session";
    const q = QUOTES[Math.floor(Date.now() / 86400000) % QUOTES.length];

    // scoreboard
    $("team").innerHTML = esc(d.ticker || "NQ") + "<small>" + esc(sessName) + " session · " + esc(d.stamp) + " ET</small>";
    $("bPx").textContent = fmt(d.px);
    $("bSub").textContent = (d.mkt ? d.mkt : "") + (d.atr && d.atr.pct !== null ? " · " + d.atr.pct + "% of range" : "") + (d.delta && d.delta.v !== null ? " · Δ " + (d.delta.v > 0 ? "+" : "") + d.delta.v.toLocaleString("en-US") : "");
    $("bRegime").textContent = R.name;
    $("bRegime").style.color = R.lean > 0 ? "var(--bull)" : R.lean < 0 ? "var(--bear)" : "var(--amber)";

    const chips = [
      { k: "Regime", v: R.name, c: R.lean > 0 ? "bull" : R.lean < 0 ? "bear" : "amber" },
      { k: "vs prev session value", v: R.ps ? word(R.ps.st) : "n/a", c: R.ps ? (R.ps.st > 0 ? "bull" : R.ps.st < 0 ? "bear" : "amber") : "" },
      { k: "VP regime", v: d.reg ? d.reg.name : "n/a", c: "amber" },
      { k: "Market line", v: d.mkt || "n/a", c: /up/i.test(d.mkt || "") ? "bull" : /down/i.test(d.mkt || "") ? "bear" : "amber" },
      { k: sessName + " range used", v: d.atr && d.atr.pct !== null ? d.atr.pct + "%" : "n/a", c: d.atr && d.atr.pct !== null ? (d.atr.pct < 70 ? "bull" : d.atr.pct > 100 ? "bear" : "amber") : "" },
      { k: "Delta", v: d.delta && d.delta.v !== null ? (d.delta.v > 0 ? "+" : "") + d.delta.v.toLocaleString("en-US") : "n/a", c: d.delta && d.delta.v !== null ? (d.delta.v > 0 ? "bull" : d.delta.v < 0 ? "bear" : "amber") : "" }
    ];
    const readParts = [];
    if (R.ps) readParts.push(`Price is <b>${word(R.ps.st)}</b> the previous session's value (${fmt(R.ps.val)} – ${fmt(R.ps.vah)})` + (R.pd ? `, ${word(R.pd.st)} the prior day's, ${word(R.pw ? R.pw.st : 0)} the prior week's.` : "."));
    readParts.push(`<b>${R.name}.</b> ${R.note}`);
    const hinge = aAbove && aBelow ? `The session is the range between ${zl(aBelow)} and ${zl(aAbove)}.` : aAbove ? `The level that matters is ${zl(aAbove)} overhead.` : aBelow ? `The level that matters is ${zl(aBelow)} underneath.` : `No three-framework zone nearby. Context only, smaller size.`;
    readParts.push(hinge);

    const play = (cls, tag, title, big, steps, fits) => `<div class="play ${cls}"><div class="tag">${tag}</div><div class="big">${big}</div>${steps.map((s) => `<div class="step"><b>${s[0]}</b><div>${s[1]}</div></div>`).join("")}<div class="fits">${fits}</div></div>`;
    const playsHtml = [
      play("bull", "Bullish", "", P.bull.hold ? "Hold " + zl(P.bull.hold) : "No support under price", [
        ["Trigger", esc(P.bull.trigger)],
        ["Targets", esc(P.bull.driveTxt) + "."],
        ["Beyond", "Past the resistance: " + esc(P.bull.beyondTxt) + "."],
        ["Wrong if", esc(P.bull.inval)]], esc(P.bull.fits)),
      play("bear", "Bearish", "", P.bear.hold ? "Fail " + zl(P.bear.hold) : "No resistance over price", [
        ["Trigger", esc(P.bear.trigger)],
        ["Targets", esc(P.bear.driveTxt) + "."],
        ["Beyond", "Past the support: " + esc(P.bear.beyondTxt) + "."],
        ["Wrong if", esc(P.bear.inval)]], esc(P.bear.fits)),
      play("chop", "Balanced", "", (P.chop.bot ? fmt(P.chop.bot.hi) : "support") + " ↔ " + (P.chop.top ? fmt(P.chop.top.lo) : "resistance"), [
        ["Read", esc(P.chop.txt)],
        ["Wrong if", "A 5m close outside the bracket with the delta on that side."]], esc(P.chop.fits))
    ].join("");

    const watch = [];
    const h = parseInt((d.stamp.split(" ")[1] || "0").split(":")[0], 10);
    if (h >= 18 || h < 3) watch.push("Asia tape: thin, sweep-and-revert. The Asia range gets broken by London 93 to 95 percent of the time and revisited 96 to 97 percent, so its edges are levels, and the first London break is usually a sweep.");
    if (h >= 23 || h < 4) watch.push("Handoff window, 23:30 to 03:30 ET: the one overnight clock edge, with a mild long bias into the European open. Read trapped sellers boxes more seriously than trapped buyers here.");
    if (h >= 3 && h < 9) watch.push("London tape: the first break of the Asia range is usually a sweep that comes back inside. Wait for the 5m close beyond the range edge, and expect the 08:30 ET data window to reset the picture.");
    if (h >= 9 && h < 12) watch.push("New York open: the first 30 minutes set the tone, and a strong open drive tends to carry into the last half hour. Tiny overnight gaps fill about 78 percent of the time, large ones only 8 percent.");
    if (h >= 11 && h < 14) watch.push("Lunch: 11:00 to 13:00 ET runs flat to negative on average. Rotation between value edges, small targets, worst follow-through of the day.");
    if (h >= 14 && h < 17) watch.push("Into the close: the last 30 minutes usually continue the day's direction as hedging flows push the same way, and 15:15 to 15:45 is the busiest window. Do not fade a trend day here.");
    if (R.stretched) watch.push(`Range stretched: ${d.atr.pct}% of the average ${d.atr.sess} range used. Fade extremes at a level, do not chase breakouts.`);
    if (d.day && d.day.pct !== null && d.day.pct >= 100) watch.push(`The day has used ${d.day.pct}% of its daily ATR. New extremes are low-odds.`);
    d.levels.filter((l) => l.fam === "TRAP").forEach((t) => watch.push(`${t.name} ${fmt(t.px)} ${/potential/.test(t.extra) ? "is still potential: wait for the failed breakout to close" : "is confirmed: a 5m close through " + fmt(t.px) + " releases it"}.`));
    const npocs = d.levels.filter((l) => l.fam === "NPOC");
    if (npocs.length) watch.push("Naked POCs: " + npocs.map((n) => fmt(n.px) + " (" + n.extra + ")").join(", ") + ". Unfinished business, magnets on a push.");
    if (R.deltaSign !== 0 && R.trending && ((R.up && R.deltaSign < 0) || (!R.up && R.deltaSign > 0))) watch.push("Delta disagrees with the trend direction. Treat the trend as unconfirmed.");
    watch.push("Sheet time " + d.stamp + " ET. If price has moved far from these levels, wait for the next sheet before trusting the levels.");
    if (d.unknown.length) watch.push("Lines I could not read: " + d.unknown.join(" · "));
    const one = aAbove && aBelow ? `The one thing: which way price leaves the ${zl(aBelow)} to ${zl(aAbove)} box, on a 5m close with the delta behind it.` : aBelow ? `The one thing: does ${zl(aBelow)} hold on a 5m close.` : aAbove ? `The one thing: does ${zl(aAbove)} hold on a 5m close.` : "The one thing: no A zone nearby. Wait for price to reach one before doing anything.";

    out.innerHTML = `
      <section><div class="sec-h"><span class="num">01</span><h2>The read</h2><span class="tip">where price sits, and what kind of session this is</span></div>
        <div class="chips">${chips.map((c) => `<div class="chip ${c.c}"><div class="k">${esc(c.k)}</div><div class="v">${esc(c.v)}</div></div>`).join("")}</div>
        <div class="read">${readParts.map((p) => `<p>${p}</p>`).join("")}</div>
      </section>
      <section><div class="sec-h"><span class="num">02</span><h2>Levels</h2><span class="tip">★ per framework stacked · 3+ = A zone · nearest ${NEAR} each side, the rest folded</span></div>
        <div class="field">
          <div class="endzone bear">Above · resistance</div>
          ${farAbove.length ? `<details class="more"><summary>Show ${farAbove.length} more above</summary>${farAbove.map(yard).join("")}</details>` : ""}
          ${nearAbove.map(yard).join("")}
          ${at.map((z) => yard(z).replace('class="yard', 'class="yard a')).join("")}
          <div class="ball"><div class="px">${fmt(d.px)}</div><div>current price · ${esc(sessName)} session</div></div>
          ${nearBelow.map(yard).join("")}
          ${farBelow.length ? `<details class="more"><summary>Show ${farBelow.length} more below</summary>${farBelow.map(yard).join("")}</details>` : ""}
          <div class="endzone bull">Below · support</div>
        </div>
      </section>
      <section><div class="sec-h"><span class="num">03</span><h2>Scenarios</h2><span class="tip">from current price, then beyond the nearest levels</span></div><div class="plays">${playsHtml}</div></section>
      <section><div class="sec-h"><span class="num">04</span><h2>Mindset</h2></div><div class="huddle"><div class="q">“${esc(q[0])}”</div><div class="who">${esc(q[1])}</div></div></section>
      <section><div class="sec-h"><span class="num">05</span><h2>Calendar and news</h2><span class="tip">what can move the tape</span></div><div id="newsBox">${newsHtml()}</div></section>
      <section><div class="sec-h"><span class="num">06</span><h2>Watch for</h2></div><ul class="watch">${watch.map((w) => `<li>${esc(w)}</li>`).join("")}</ul><div class="one">${esc(one)}</div></section>`;

    // plain text
    const L = [];
    L.push("SESSION GAMEPLAN " + (d.ticker || "") + " " + d.stamp + " ET px " + fmt(d.px));
    L.push(""); L.push("THE READ"); readParts.forEach((p) => L.push(p.replace(/<[^>]+>/g, "")));
    L.push(""); L.push("LEVELS (★ per framework, 3+ = A zone)"); L.push("ABOVE");
    above.forEach((z) => L.push(`${zl(z).padEnd(22)} ${stars(z.score).padEnd(6)} ${zw(z)} — ${z.role}`));
    L.push(`—— price ${fmt(d.px)} ——`);
    below.forEach((z) => L.push(`${zl(z).padEnd(22)} ${stars(z.score).padEnd(6)} ${zw(z)} — ${z.role}`)); L.push("BELOW");
    L.push(""); L.push("SCENARIOS");
    L.push("BULLISH [" + P.bull.fits + "]"); L.push("  Trigger: " + P.bull.trigger); L.push("  Targets: " + P.bull.driveTxt); L.push("  Beyond resistance: " + P.bull.beyondTxt); L.push("  Wrong if: " + P.bull.inval);
    L.push("BEARISH [" + P.bear.fits + "]"); L.push("  Trigger: " + P.bear.trigger); L.push("  Targets: " + P.bear.driveTxt); L.push("  Beyond support: " + P.bear.beyondTxt); L.push("  Wrong if: " + P.bear.inval);
    L.push("BALANCED: " + P.chop.txt);
    L.push(""); L.push("MINDSET: \"" + q[0] + "\" — " + q[1]);
    L.push(""); L.push("WATCH FOR"); watch.forEach((w) => L.push("- " + w)); L.push(one);
    plainText = L.join("\n");
  }

  function build() {
    const text = $("in").value;
    try { localStorage.setItem("gameplan.last", text); } catch (e) {}
    const d = parse(text);
    render(d);
    $("status").textContent = d.levels.length ? `${d.levels.length} levels read` + (d.hasSD && d.hasVP ? ", both sheets" : d.hasSD ? ", S&D sheet only" : d.hasVP ? ", VP sheet only" : "") : "";
  }
  $("build").addEventListener("click", build);
  $("sample").addEventListener("click", () => { $("in").value = SAMPLE; build(); $("status").textContent += " · example data"; $("bAge").textContent = "example sheet"; });
  $("copy").addEventListener("click", async () => {
    if (!plainText) build();
    try { await navigator.clipboard.writeText(plainText); $("status").textContent = "Plan copied"; }
    catch (e) { $("status").textContent = "Copy blocked here: select the text and copy it by hand"; }
  });

  // ---- the TradingView feed ----------------------------------------------------------------
  const feedAge = (iso) => { const ms = Date.now() - new Date(String(iso).replace(" ", "T")).getTime(); if (isNaN(ms)) return ""; const m = Math.round(ms / 60000); return m < 60 ? m + " min ago" : Math.round(m / 60) + " h ago"; };
  async function fetchFeed(auto) {
    $("bAge").textContent = "fetching...";
    try {
      const r = await fetch(FEED_URL, { headers: { apikey: FEED_KEY, Authorization: "Bearer " + FEED_KEY }, cache: "no-store" });
      if (!r.ok) throw new Error("http " + r.status);
      const rows = await r.json();
      const sd = rows.find((x) => x.kind === "SD"), vp = rows.find((x) => x.kind === "VP");
      if (!sd && !vp) { $("bAge").textContent = "no sheets in the feed yet"; return; }
      $("in").value = [sd && sd.text, vp && vp.text].filter(Boolean).join("\n").trim();
      build();
      $("bAge").textContent = "sheet " + (sd ? "S&D " + feedAge(sd.received_at) : "") + (vp ? " · VP " + feedAge(vp.received_at) : "");
    } catch (e) {
      $("bAge").textContent = auto ? "feed not reachable · last sheet shown" : "feed not reachable (" + e.message + ")";
    }
  }
  // Refresh reloads the whole page, so a home-screen copy (which has no
  // pull-to-refresh) picks up new sheets AND new versions of the page.
  $("fetch").addEventListener("click", () => { location.reload(); });
  // Self-check: a home-screen app can hold a stale copy for days. Fetch the
  // live page once per open and reload if its version moved on.
  (async () => {
    try {
      const meta = document.querySelector('meta[name="app-version"]');
      const mine = meta ? meta.getAttribute("content") : "";
      const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const m = (await r.text()).match(/name="app-version" content="([^"]+)"/);
      if (m && m[1] !== mine && !sessionStorage.getItem("reloaded-" + m[1])) {
        sessionStorage.setItem("reloaded-" + m[1], "1");
        location.reload();
      }
    } catch (e) { /* offline: keep what we have */ }
  })();
  let last = "";
  try { last = localStorage.getItem("gameplan.last") || ""; } catch (e) {}
  if (last.trim()) { $("in").value = last; build(); $("bAge").textContent = "last sheet on this device"; }
  else { $("in").value = SAMPLE; build(); $("bAge").textContent = "example sheet"; }
  fetchFeed(true);
  fetchNews();
})();
</script>
</body>
</html>
